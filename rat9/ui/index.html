<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>rat9-config</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <!-- ── navegación ─────────────────────────────────────────────────────── -->
  <nav class="rail" aria-label="Secciones">
    <button class="rail-item" data-view="panel" aria-current="page"
            data-name="Panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="4.5"/>
        <path d="M12 6.5v5"/><path d="M7 11.5h10"/>
      </svg>
      <span class="rail-label">Panel</span>
    </button>

    <button class="rail-item" data-view="botones" data-name="Botones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" aria-hidden="true">
        <path d="M4 12.5a8 8 0 0 1 16 0"/>
        <path d="M4 12.5v3a8 8 0 0 0 16 0v-3"/>
        <path d="M9.5 6.2v6.3"/>
      </svg>
      <span class="rail-label">Botones</span>
    </button>

    <button class="rail-item" data-view="dpi" data-name="DPI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" aria-hidden="true">
        <path d="M3.5 17a9 9 0 1 1 17 0"/>
        <path d="M12 17l4.2-5.6"/>
        <circle cx="12" cy="17" r="1.4"/>
      </svg>
      <span class="rail-label">DPI</span>
    </button>

    <button class="rail-item" data-view="macros" data-name="Macros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" aria-hidden="true">
        <path d="M13 2.5 5.5 13.5H11l-1 8 7.5-11H12l1-8Z"/>
      </svg>
      <span class="rail-label">Macros</span>
    </button>

    <button class="rail-item" data-view="perfiles" data-name="Perfiles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" aria-hidden="true">
        <path d="M4 6.5h16v13H4z"/><path d="M4 6.5 7 3h10l3 3.5"/>
        <path d="M9 12.5h6"/>
      </svg>
      <span class="rail-label">Perfiles .pr0</span>
    </button>

    <div class="rail-foot" id="railFoot">conectando…</div>
  </nav>

  <!-- ── barra de estado ────────────────────────────────────────────────── -->
  <header class="head">
    <div class="head__brand">
      <h1>rat9<span>-config</span></h1>
      <span class="head__hw">Mad Catz R.A.T.9 · 0738:1709</span>
    </div>
    <div class="head__chips">
      <span class="chip">
        <i class="dot dot--wait" id="dot" role="img" aria-label="estado"></i>
        <span id="conn">conectando…</span>
      </span>
      <span class="chip">perfil <b id="mode">—</b></span>
      <span class="chip chip--accent">batería <b id="battHead">—</b></span>
    </div>
  </header>

  <!-- ── banco del dispositivo ──────────────────────────────────────────── -->
  <main class="canvas">
    <div class="bench">
      <span class="bench__mark bench__mark--tl"></span>
      <span class="bench__mark bench__mark--tr"></span>
      <span class="bench__mark bench__mark--bl"></span>
      <span class="bench__mark bench__mark--br"></span>
      <div class="bench__floor" aria-hidden="true"></div>

      <div class="device-frame" id="deviceFrame">
        <p class="hint" id="deviceMsg">cargando diagrama…</p>
      </div>

      <!-- Retrato del dispositivo. Tres vistas: el esquema (geometría exacta y
           zonas clicables), el render del producto original, y las dos capas
           superpuestas.
           OJO con la tercera: el plano va ajustado a la CAJA del render, no a
           su forma. Son siluetas distintas (el render mide 0,72 de proporción y
           el esquema 0,65, y el original tiene algo de perspectiva), así que no
           coinciden al milímetro por mucho que se ajuste la caja. -->
      <figure class="device-figure hidden" id="deviceFigure">
        <!-- DOS CAPAS del mismo dibujo: la imagen realista debajo y el plano
             translúcido encima. Miden lo mismo y el SVG viene ya transformado
             a la caja del ratón de la imagen, así que encajan solas. -->
        <div class="device-stack">
          <img src="assets/raton-original.png" width="700" height="1090"
               alt="Render cenital del Mad Catz R.A.T.9, del software original">
          <div class="capa hidden" id="deviceCapa"></div>
        </div>
        <figcaption>
          Render cenital del <b>software original de Mad Catz</b>. Para la
          geometría exacta y las zonas clicables, usa la vista <b>Esquema</b>.
        </figcaption>
      </figure>

      <!-- VISOR DE GIRO: 24 fotogramas REALES del aparato, extraídos del
           instalador del software original. No es un modelo 3D inventado: es
           exactamente lo que hacía el software de Mad Catz, que tampoco era 3D
           sino una ruleta de sprites. Se arrastra para girarlo.
           Los fotogramas NO están en el repositorio (son material gráfico
           ajeno): los saca tools/preparar-giro.sh de la copia local del
           instalador. Si no están, el botón no se ofrece y no pasa nada. -->
      <figure class="device-figure hidden" id="deviceGiro">
        <div class="giro" id="giroCaja" tabindex="0" role="slider"
             aria-label="Girar el ratón" aria-valuemin="0" aria-valuemax="23"
             aria-valuenow="0">
          <img id="giroImg" width="550" height="698" alt="El R.A.T.9 girando,
               fotograma a fotograma">
        </div>
        <div class="giro__pista" aria-hidden="true"><i id="giroPista"></i></div>
        <figcaption>
          Giro real del aparato, fotograma a fotograma. <b>Arrastra</b> para
          girarlo, o usa las flechas del teclado.
        </figcaption>
      </figure>

      <!-- la lectura del raton, en el sitio del display de LEDs del original -->
      <div class="bench__readout">
        <span class="hud">DPI del perfil activo</span>
        <div class="bench__display">
          <div class="dpiled" id="stageLed" role="img" aria-label="lectura de DPI"></div>
          <span class="bench__unit">dpi</span>
        </div>
      </div>

      <div class="bench__toggle" role="group" aria-label="Vista del dispositivo">
        <button class="btn btn--quiet" data-figura="esquema" aria-pressed="true">
          Esquema
        </button>
        <button class="btn btn--quiet" data-figura="original" aria-pressed="false">
          Producto
        </button>
        <button class="btn btn--quiet" data-figura="superpuesto" aria-pressed="false">
          Las dos capas
        </button>
        <button class="btn btn--quiet" data-figura="giro" aria-pressed="false"
                id="btnGiro">
          Giro
        </button>
      </div>

      <!-- cajetín del plano: solo hechos, nada inventado -->
      <div class="bench__title">
        <div><span class="hud">Dispositivo</span><b>Mad Catz R.A.T.9</b></div>
        <div><span class="hud">Interfaz</span><b>USB 0738:1709</b></div>
        <div><span class="hud">Vista</span><b>Planta</b></div>
        <div><span class="hud">Estado</span><b id="titleEstado">—</b></div>
      </div>
    </div>

    <ol class="numb" id="numb" aria-label="Controles del ratón por número"></ol>
  </main>

  <!-- ── panel de la vista activa ───────────────────────────────────────── -->
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/api.js"></script>
<script src="js/diagram.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
