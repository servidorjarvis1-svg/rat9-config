<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>rat9-config — banco de pruebas del diagrama</title>
<style>
  /* Banco de pruebas provisional: sirve para verificar el enrutado de
     /ui/, la carga del SVG y la API, mientras se construye la interfaz
     definitiva. NO es la interfaz final. */
  :root {
    --bg-0: oklch(0.145 0.012 255);
    --bg-1: oklch(0.175 0.014 255);
    --bg-2: oklch(0.215 0.016 255);
    --text-hi: oklch(0.955 0.01 250);
    --text-mute: oklch(0.72 0.02 255);
    --accent-500: oklch(0.72 0.175 225);
    --hairline: color-mix(in oklab, var(--bg-1), white 14%);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-0); color: var(--text-hi);
    font: 14px/1.55 system-ui, sans-serif;
    display: grid; grid-template-columns: minmax(0,1fr) 340px;
    gap: 1px; background: var(--hairline); block-size: 100vh;
  }
  @media (max-width: 820px) { body { grid-template-columns: minmax(0,1fr); } }
  .stage, aside { background: var(--bg-0); min-width: 0; overflow: auto; }
  .stage { display: grid; place-items: center; padding: 20px; }
  aside { padding: 18px; }
  svg { inline-size: 100%; max-block-size: 80vh; block-size: auto; }
  h1 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
       color: var(--text-mute); margin: 0 0 14px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
        font-size: 13px; font-variant-numeric: tabular-nums; }
  .kv dt { color: var(--text-mute); }
  .kv dd { margin: 0; color: var(--accent-500); }
  .log { margin-block-start: 18px; padding-block-start: 14px;
         border-block-start: 1px solid var(--hairline); font-size: 12px;
         color: var(--text-mute); }
  .log b { color: var(--text-hi); }
</style>
</head>
<body>
  <div class="stage" id="stage">cargando diagrama…</div>
  <aside>
    <h1>Estado en vivo</h1>
    <dl class="kv" id="state"></dl>
    <div class="log" id="log">Pulsa una zona del ratón.</div>
  </aside>

<script>
const $ = (s) => document.querySelector(s);

async function cargarDiagrama() {
  const r = await fetch('/ui/diagram-mouse.svg');
  if (!r.ok) throw new Error('SVG HTTP ' + r.status);
  const txt = await r.text();
  const doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
  const svg = doc.documentElement;
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  $('#stage').replaceChildren(svg);

  const zonas = [...svg.querySelectorAll('.z')];
  for (const z of zonas) {
    z.addEventListener('click', () => seleccionar(z, zonas));
    z.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); seleccionar(z, zonas);
      }
    });
  }
  return zonas.length;
}

function seleccionar(z, zonas) {
  for (const o of zonas) o.classList.remove('sel');
  z.classList.add('sel');
  const svg = z.closest('svg');
  svg.classList.add('sel-mode');
  const uso = z.dataset.usage;
  $('#log').innerHTML = 'Zona <b>' + z.dataset.zone + '</b> · uso HID <b>'
    + uso + '</b> · ' + z.getAttribute('aria-label');
}

async function cargarEstado() {
  const s = await (await fetch('/api/state')).json();
  const dpi = {};
  for (const d of (s.dpi || [])) (dpi[d.mode] ||= {})[d.axis] = d.dpi;
  const filas = [
    ['Conectado', s.connected ? 'sí' : 'no'],
    ['Perfil activo', s.mode ?? '—'],
    ['Batería', s.battery != null ? s.battery + ' %' : 'desconocida'],
    ...Object.keys(dpi).sort().map(
      m => ['DPI perfil ' + m, dpi[m].X + ' / ' + dpi[m].Y]),
  ];
  $('#state').innerHTML = filas.map(
    ([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('');
}

(async () => {
  try {
    const n = await cargarDiagrama();
    await cargarEstado();
    $('#log').innerHTML = 'Diagrama cargado: <b>' + n + '</b> zonas. '
      + 'Pulsa una.';
    setInterval(cargarEstado, 3000);
  } catch (e) {
    $('#stage').textContent = 'ERROR: ' + e.message;
    $('#log').textContent = 'Fallo: ' + e.message;
  }
})();
</script>
</body>
</html>
